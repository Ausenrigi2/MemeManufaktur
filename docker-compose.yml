services:
  mememanufaktur:
    build: .
    container_name: mememanufaktur
    ports:
      - "${MEME_PORT:-8080}:8080"
    # Daten liegen bewusst außerhalb des Repos/Compose-Ordners und überleben
    # git pull, Rebuilds und docker compose down -v.
    volumes:
      - "${MEME_DATA_PATH:-/srv/mememanufaktur/data}:/app/data"
    restart: unless-stopped
